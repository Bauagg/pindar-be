name: CI Check - Build & Lint

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Install & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check server can start (syntax check)
        run: node --check server.js

      - name: Check app.js syntax
        run: node --check src/app.js

      - name: Lint
        run: npm run lint
        continue-on-error: true
